<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení – Nicolet CZ Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body { overflow: auto; }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>Nicolet CZ</h1>
      <p>Administrace webu</p>
    </div>

    <div id="login-error" class="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="admin@nicolet.cz" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Heslo</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="login-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Přihlásit se
      </button>
    </form>

    <div style="margin-top:20px;text-align:center;">
      <a href="/" style="font-size:0.78rem;color:var(--text-3);">← Zpět na web</a>
    </div>
  </div>
</div>

<script type="module">
const form = document.getElementById('login-form');
const errEl = document.getElementById('login-error');
const btn = document.getElementById('login-btn');

// Check if already logged in via cookie
(async function() {
  try {
    const response = await fetch('/api/auth/me', { credentials: 'include' });
    if (response.ok) {
      window.location.href = '/admin';
    }
  } catch { /* not logged in, stay on login page */ }
})();

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = 'Přihlašuji…';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const contentType = response.headers.get('content-type');
        const data = contentType?.includes('application/json')
          ? await response.json()
          : { error: await response.text() };

        if (!response.ok) {
          throw new Error(data.error || 'Přihlášení selhalo');
        }

        // Token is now in httpOnly cookie, only store user data
        localStorage.setItem('nicolet_user', JSON.stringify(data.user));
        window.location.href = '/admin';

    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Přihlásit se
      `;
    }
  });
</script>

</body>
</html>
